[package]
name = "mc-blackhole"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
fastnbt = "2.6.1"
flate2 = "1.1.9"
paste = "1.0.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.2", features = ["v4"] }
generics_macro = { path = "./generics_macro" }
cgmath = { version = "0.18.0", features = ["swizzle"], default-features = false }
