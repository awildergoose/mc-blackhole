[package]
name = "mc-blackhole"
version = "0.1.0"
edition = "2024"

[dependencies]
generics_macro = { path = "./generics_macro" }
anyhow = "1.0.103"
bytes = "1.12.1"
flate2 = { version = "1.1.9", features = ["zlib-rs"], default-features = false }
paste = "1.0.15"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "io-util",
] }
uuid = { version = "1.23.5", features = ["v4"] }
cgmath = { version = "0.18.0", features = [
    "swizzle",
], default-features = false }
rand = "0.10.2"
noise = { version = "0.9.0", features = ["std"] }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Full performance profile because why not lol
[profile.release-perf]
inherits = "release"
codegen-units = 1
debug = false
strip = true
overflow-checks = false
panic = "abort"
# Unsure of these \/
opt-level = 3
lto = true
# Unsure of these /\

[profile.release-info]
inherits = "release"
debug = true
strip = false
